<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Placement Management System</title><style>body{margin:0;font-family:Arial;background:#f4f6fa;color:#222}nav{background:#172033;color:#fff;padding:16px 8%;display:flex;gap:15px;align-items:center}nav h2{margin-right:auto;margin-top:0;margin-bottom:0}.wrap{max-width:1100px;margin:auto;padding:30px}.card{background:#fff;padding:20px;margin:15px 0;border-radius:10px;box-shadow:0 2px 10px #ddd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}input,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:5px}button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:10px 15px;cursor:pointer}.auth{max-width:430px;margin:55px auto}.status{background:#dbeafe;padding:5px 10px;border-radius:14px;font-weight:bold}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.danger{background:#dc2626}.secondary{background:#64748b}</style></head><body><nav><h2>🎓 Placement Portal</h2><span id="info"></span><button id="logout" class="hidden" onclick="out()">Logout</button></nav><div id="app"></div><script>
let users=JSON.parse(localStorage.users||'[]'),companies=JSON.parse(localStorage.companies||'[]'),apps=JSON.parse(localStorage.apps||'[]'),current=JSON.parse(localStorage.current||'null');
if(!companies.length)companies=[{id:1,n:'TCS',r:'Software Developer',l:'Noida',p:'7',e:'60% or above'},{id:2,n:'Infosys',r:'Systems Engineer',l:'Bangalore',p:'6.5',e:'No active backlogs'},{id:3,n:'Wipro',r:'Project Engineer',l:'Gurugram',p:'5.5',e:'60% or above'}];
function save(){localStorage.users=JSON.stringify(users);localStorage.companies=JSON.stringify(companies);localStorage.apps=JSON.stringify(apps);localStorage.current=JSON.stringify(current)}
const g=x=>document.getElementById(x);
function render(){g('info').textContent=current?'Welcome, '+current.name+' ('+current.role+')':'';g('logout').className=current?'':'hidden';if(!current){g('app').innerHTML='<div class="auth card"><h2>Campus Placement System</h2><input id="name" placeholder="Full Name"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><select id="role"><option>STUDENT</option><option>ADMIN</option></select><button onclick="reg()">Register</button> <button class="secondary" onclick="login()">Login</button><p>Create an Admin account to add companies, then a Student account to apply.</p></div>';return}current.role==='ADMIN'?admin():student()}
function reg(){let name=g('name').value,email=g('email').value,pass=g('pass').value,role=g('role').value;if(!name||!email||!pass)return alert('Fill all fields');if(users.some(u=>u.email===email))return alert('Email already registered');current={id:Date.now(),name,email,pass,role};users.push(current);save();render()}
function login(){let u=users.find(u=>u.email===g('email').value&&u.pass===g('pass').value);if(!u)return alert('Invalid login. Register first.');current=u;save();render()}
function out(){current=null;save();render()}
function cards(ad){return companies.map(c=>'<div class="card"><h2>'+c.n+'</h2><p><b>Role:</b> '+c.r+'</p><p><b>Location:</b> '+c.l+'</p><p><b>Package:</b> '+c.p+' LPA</p><p><b>Eligibility:</b> '+c.e+'</p>'+(ad?'<button class="danger" onclick="del('+c.id+')">Delete</button>':'<button onclick="apply('+c.id+')">Apply Now</button>')+'</div>').join('')}
function student(){let mine=apps.filter(a=>a.sid===current.id);g('app').innerHTML='<div class="wrap"><h1>Find Your Dream Opportunity 🚀</h1><div class="grid">'+cards(false)+'</div><h2>My Applications</h2><div class="card">'+(mine.length?mine.map(a=>{let c=companies.find(c=>c.id===a.cid);return '<p><b>'+c.n+'</b> — <span class="status">'+a.status+'</span></p>'}).join(''):'No applications yet.')+'</div></div>'}
function apply(cid){if(apps.some(a=>a.sid===current.id&&a.cid===cid))return alert('Already applied');apps.push({id:Date.now(),sid:current.id,cid,status:'APPLIED'});save();alert('Application submitted successfully!');render()}
function admin(){let rows=apps.map(a=>{let s=users.find(u=>u.id===a.sid)||{name:'Unknown'},c=companies.find(c=>c.id===a.cid)||{n:'Removed'};return '<tr><td>'+s.name+'</td><td>'+c.n+'</td><td><select onchange="status('+a.id+',this.value)">'+['APPLIED','SHORTLISTED','SELECTED','REJECTED'].map(x=>'<option '+(x===a.status?'selected':'')+'>'+x+'</option>').join('')+'</select></td></tr>'}).join('');g('app').innerHTML='<div class="wrap"><div class="card"><h2>Admin Dashboard</h2><input id="cn" placeholder="Company Name"><input id="cr" placeholder="Job Role"><input id="cl" placeholder="Location"><input id="cp" placeholder="Package (LPA)"><input id="ce" placeholder="Eligibility"><button onclick="add()">Add Company</button></div><h2>Companies</h2><div class="grid">'+cards(true)+'</div><h2>Student Applications</h2><div class="card">'+(rows?'<table><tr><th>Student</th><th>Company</th><th>Status</th></tr>'+rows+'</table>':'No applications yet.')+'</div></div>'}
function add(){let v=['cn','cr','cl','cp','ce'].map(x=>g(x).value);if(v.some(x=>!x))return alert('Fill all details');companies.push({id:Date.now(),n:v[0],r:v[1],l:v[2],p:v[3],e:v[4]});save();render()}
function del(id){companies=companies.filter(c=>c.id!==id);save();render()}
function status(id,v){apps.find(a=>a.id===id).status=v;save();render()}render();
</script></body></html>
